# Builds twsearch on the three platforms and checks that each build works,
# including the part a page uses: `twsearch --serve` spawning searches and
# streaming them back (see docs/bridgeprotocol.md).  On a v* tag, attaches
# the macOS and Windows binaries to a release (Linux users build their own).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            cxxflags: "-O3 -Warray-bounds -Wextra -Wall -pedantic -std=c++20 -g1 -Wsign-compare"
          # One binary for both Apple Silicon and Intel Macs.
          - os: macos-latest
            platform: macos
            cxxflags: "-O3 -Warray-bounds -Wextra -Wall -pedantic -std=c++20 -g1 -Wsign-compare -arch arm64 -arch x86_64"
    steps:
      - uses: actions/checkout@v4
        # The build names itself after the tag it was built at, so fetch
        # them: the default checkout has none.
        with:
          fetch-depth: 0

      # -g1: function names and line tables, for backtraces, at a fraction
      # of the size of -g.
      - name: Build
        run: make build CXXFLAGS="${{ matrix.cxxflags }}"

      - name: Both Mac architectures are there and run
        if: matrix.platform == 'macos'
        run: |
          lipo -info build/bin/twsearch
          lipo build/bin/twsearch -verify_arch arm64 x86_64
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 build/bin/twsearch --schreiersims samples/main/3x3x3.tws \
              | grep -q "^State size is 43252003274489856000$"
            echo "x86_64 slice runs under Rosetta"
          else
            echo "no Rosetta on this runner; x86_64 slice built but not run"
          fi

      - name: Searches with known answers
        run: make test-cpp-samples

      - name: Serving, as a page uses it
        run: make test-serve

      # Before the SERVE=0 build below, which replaces this binary.
      - uses: actions/upload-artifact@v4
        with:
          name: twsearch-${{ matrix.platform }}
          path: build/bin/twsearch

      - name: Size
        run: ls -l build/bin/twsearch

      - name: Build without the server
        run: make clean && make build SERVE=0

  windows:
    name: windows-x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        # The build names itself after the tag it was built at, so fetch
        # them: the default checkout has none.
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # A static build, so what comes out needs no DLLs from here.
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            make
            grep
            git

      # This git is not the one that made the checkout, and it refuses to
      # read a tree it thinks belongs to someone else.  Without this the
      # build cannot ask for the tag and falls back to v0.0.0.
      - name: Let git read this checkout
        run: git config --global --add safe.directory '*'

      - name: Build
        run: |
          make build \
            CXXFLAGS="-O3 -Warray-bounds -Wextra -Wall -pedantic -std=c++20 -g1 -Wsign-compare -static -static-libgcc -static-libstdc++"

      - name: Searches with known answers
        run: make test-cpp-samples

      # Run it from cmd rather than the MSYS shell: nothing of MSYS is on the
      # path there, so this fails if the binary wants a DLL from it.
      - name: Run it outside MSYS
        shell: cmd
        run: |
          build\bin\twsearch.exe -M 1024 --nowrite samples\main\3x3x3.tws samples\main\tperm.scr

      # The Windows-only code: CreateProcess, the pipes, TerminateProcess for
      # abandon, and the socket layer.  The test starts the server itself.
      - name: Serving, as a page uses it
        shell: pwsh
        run: node test/bridge-test.mjs build/bin/twsearch.exe

      # Before the SERVE=0 build below, which replaces this binary.
      - uses: actions/upload-artifact@v4
        with:
          name: twsearch-windows-x64
          path: build/bin/twsearch.exe

      - name: Size
        run: ls -l build/bin/twsearch.exe

      - name: Build without the server
        run: |
          make clean
          make build SERVE=0 \
            CXXFLAGS="-O3 -std=c++20 -static -static-libgcc -static-libstdc++"

  # The cheap way to get a Windows binary without a Windows machine.  It is
  # only built here, not run; the job above is what says Windows works.
  windows-cross:
    name: windows cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The build names itself after the tag it was built at, so fetch
        # them: the default checkout has none.
        with:
          fetch-depth: 0
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build
        run: |
          make build \
            CXX=x86_64-w64-mingw32-g++-posix \
            CXXFLAGS="-O3 -std=c++20 -static -static-libgcc -static-libstdc++" \
            OS=Windows_NT
      - run: file build/bin/twsearch.exe | grep -q "PE32+ executable"

  release:
    name: attach the binaries to the release
    needs: [unix, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # The build names itself after the tag it was built at, so fetch
        # them: the default checkout has none.
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      # Each binary alone (what the README's curl lines fetch), and bundled
      # with the README, licenses, docs, and samples: a .tar.gz for macOS, a
      # .zip for Windows.
      - name: Name them by platform and bundle them
        run: |
          mkdir -p release
          cp artifacts/twsearch-macos/twsearch release/twsearch-macos
          cp artifacts/twsearch-windows-x64/twsearch.exe release/twsearch-windows-x64.exe
          chmod +x release/twsearch-macos
          bundle() {
            dir=twsearch-$1
            mkdir -p bundle/$dir
            cp -R README.md LICENSE-GPL.md LICENSE-MPL.md docs samples bundle/$dir/
            cp release/$2 bundle/$dir/$3
          }
          bundle macos twsearch-macos twsearch
          bundle windows-x64 twsearch-windows-x64.exe twsearch.exe
          (cd bundle && tar czf ../release/twsearch-macos.tar.gz twsearch-macos)
          (cd bundle && zip -qr ../release/twsearch-windows-x64.zip twsearch-windows-x64)
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
